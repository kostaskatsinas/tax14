name: WordPress verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tax14
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd
          tools: wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          find wp-content tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check wp-content/plugins/accountant-annual-reports/assets/admin.js
          node --check wp-content/plugins/accountant-annual-reports/assets/blocks.js
          python3 -m json.tool wp-content/themes/accountant-site/theme.json > /dev/null
      - name: Install clean WordPress
        env:
          WP_PATH: /tmp/tax14-wordpress
        run: |
          wp core download --path="$WP_PATH" --version=latest
          wp config create --path="$WP_PATH" --dbname=tax14 --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title="Example Accounting Office" --admin_user=tax14admin --admin_password=local-test-only-927 --admin_email=demo@example.test --skip-email
          wp config set WP_DEBUG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_PATH"
          cp -R wp-content/themes/accountant-site "$WP_PATH/wp-content/themes/"
          cp -R wp-content/plugins/accountant-annual-reports "$WP_PATH/wp-content/plugins/"
          wp plugin activate accountant-annual-reports --path="$WP_PATH"
          wp theme activate accountant-site --path="$WP_PATH"
          wp option update blogdescription "Accountancy · Tax advisory · Annual reports" --path="$WP_PATH"
          wp rewrite structure '/%postname%/' --path="$WP_PATH"
          wp core version --path="$WP_PATH" | tee wordpress-version.txt
      - name: WordPress integration and security checks
        run: wp eval-file tests/integration.php --path=/tmp/tax14-wordpress --user=tax14admin
      - name: Browser checks
        env:
          WP_PATH: /tmp/tax14-wordpress
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          wp server --path="$WP_PATH" --host=127.0.0.1 --port=8080 > /tmp/tax14-server.log 2>&1 &
          node tests/browser.mjs
      - name: Check PHP runtime log
        if: always()
        run: |
          if test -f /tmp/tax14-wordpress/wp-content/debug.log; then
            cat /tmp/tax14-wordpress/wp-content/debug.log
            if grep -E 'PHP (Fatal error|Parse error|Warning|Notice)' /tmp/tax14-wordpress/wp-content/debug.log; then exit 1; fi
          fi
      - name: Build installation archives
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tax14-verification-and-installers
          path: |
            artifacts/
            wordpress-version.txt
            /tmp/tax14-server.log
            /tmp/tax14-wordpress/wp-content/debug.log
